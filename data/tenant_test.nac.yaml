          description: web to laptop bidirectional
          scope: tenant
          # qos_class: level3
          # target_dscp: AF13
          subjects:
            - name: SUBJ_WEB1_laptop
              # alias: 
              description: web to laptop bidirectional
              reverse_filter_ports: true
              # service_graph: TEMPLATE1
              # qos_class: level3
              # target_dscp: AF13
              filters:
                - filter: tcp_udp_src_any_dst_any
                  action: permit
                  priority: default
                  log: true
                  no_stats: false
                - filter: icmp_src_any_dst_any
                  action: permit
                  priority: default
                  log: true
                  no_stats: false

      
      filters:
        - name: tcp_udp_src_any_dst_any
          entries:
            - name: TCP_any
              ethertype: ip
              protocol: tcp
              # destination_to_port: 389
            - name: UDP_389
              ethertype: ip
              protocol: udp
              # destination_to_port: 389
        - name: icmp_src_any_dst_any
